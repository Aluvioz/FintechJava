spring:
  application:
    name: fintech-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech_db
    username: fintech
    password: fintech123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # nunca use "update" em produção
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080