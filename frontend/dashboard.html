<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fintech - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1>Olá, <span id="user-name">...</span></h1>

        <div class="balance-box">
            <div class="label">Saldo disponível</div>
            <div class="value" id="balance-value">R$ 0,00</div>
            <div class="label" id="account-number" style="margin-top: 8px;"></div>
        </div>

        <div class="error-message" id="error-box"></div>
        <div class="error-message" id="success-box" style="background:#14532d; color:#bbf7d0;"></div>

        <form id="transfer-form">
            <label for="destination">Número da conta de destino</label>
            <input type="text" id="destination" placeholder="Ex: 172345881a">

            <label for="amount">Valor (R$)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00">

            <button type="submit">Transferir</button>
        </form>

        <h1 style="font-size: 16px; margin-top: 24px;">Extrato</h1>
        <div id="transactions-list"></div>

        <button class="logout-btn" id="logout-btn">Sair</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
