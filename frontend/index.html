<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fintech - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1 id="form-title">Entrar na sua conta</h1>

        <div class="error-message" id="error-box"></div>

        <form id="auth-form">
            <div id="name-field" style="display: none;">
                <label for="name">Nome completo</label>
                <input type="text" id="name" placeholder="Seu nome">
            </div>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>

            <button type="submit" id="submit-btn">Entrar</button>
        </form>

        <div class="toggle-link" id="toggle-link">
            Não tem conta? <span>Cadastre-se</span>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
